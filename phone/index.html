<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Explora</title>
<meta name="description" content="Keep your walk photos on this phone until you send them home to your laptop.">
<meta name="theme-color" content="#f1e8d0">
<link rel="manifest" href="/phone/manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="/phone/icons/icon-192.png">
<link rel="apple-touch-icon" href="/phone/icons/icon-192.png">
<style>
/* Explora phone: capture and send only. Tilted photo cards, a bottom dock, system fonts, nothing fetched from anywhere.
   The queue itself (ExploraCapture.mount, in capture-queue.js) builds the controls; this sheet only styles and orders them. */
*{box-sizing:border-box}
:root{--paper:#f1e8d0;--dock:#f8f1de;--card:#fffaf0;--ink:#33302a;--muted:#6a6454;--green:#3d6b45;--green-d:#2f5536;--terra:#b5532f;--amber:#d99a2b;--line:#d8cba5;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif}
html body{margin:0;min-height:100vh;min-height:100dvh;background:var(--paper);color:var(--ink);font:17px/1.5 var(--serif);
  padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left)}

.page{display:flex;flex-direction:column;max-width:32rem;margin:0 auto;padding:1.1rem 1.2rem calc(10rem + env(safe-area-inset-bottom))}
.mast{display:flex;justify-content:space-between;align-items:center;gap:1rem}
.mast p{margin:0;font-size:2rem;font-style:italic;line-height:1.1}
.mast .pm{flex:none;width:3.6rem;height:3.6rem;border-radius:50%;border:2px solid var(--muted);outline:1px dashed var(--muted);outline-offset:3px;padding:.25rem;transform:rotate(-9deg);opacity:.85;margin:.2rem .3rem 0 0}
.mast .pm img{display:block;width:100%;height:100%;border-radius:50%;filter:sepia(.4)}

/* One short line about where the photos stand. Hidden whenever the queue is showing its own status message. */
#summary{order:2}
#summary:empty{display:none}
#summary p{margin:.35rem 0 0;font-size:.98rem;line-height:1.4}
#summary p::before{content:"";display:inline-block;width:.7rem;height:.7rem;margin-right:.5rem;border-radius:50%;background:var(--amber)}
#summary p[data-state=failed]::before{background:var(--terra)}
#summary p[data-state=offline]::before{background:#8d8f80}
#summary strong{font-weight:700}

/* ExploraCapture.mount builds everything inside #app. Its children become part of .page so they can be ordered. */
#app.ex{display:contents}
#app.ex>*{order:4}
#app.ex>h1{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#app.ex>p:nth-child(2){order:1;margin:.5rem 0 0;font-style:italic;color:var(--muted)}
#app.ex>[role=status]{order:3;font-style:italic;min-height:0;margin:.5rem 0 0}
#app.ex>details{order:5}
#app.ex>p:nth-child(3){order:6;margin:1.4rem 0 0;font-size:.85rem;font-style:italic;color:var(--muted)}
#app.ex>p.muted:nth-child(n+7){order:7;font-size:.85rem}
#app.ex>p.muted:nth-child(6){margin:2.4rem 0;text-align:center;font-style:italic;color:var(--muted)}

/* queued photos: tilted prints on cream cards */
#app.ex ul{list-style:none;margin:.4rem 0 0;padding:0}
#app.ex li{position:relative;display:grid;grid-template-columns:6.6rem 1fr;gap:.95rem;align-items:start;margin:1.1rem 0;padding:.9rem;background:var(--card);
  border:1px solid var(--line);border-radius:3px;box-shadow:0 2px 4px rgba(70,50,20,.18),0 10px 16px -10px rgba(70,50,20,.3)}
#app.ex ul>li:nth-child(odd){transform:rotate(-.7deg)}
#app.ex ul>li:nth-child(even){transform:rotate(.6deg)}
#app.ex li img{width:6.6rem;height:7rem;object-fit:cover;border:.4rem solid #fff;border-bottom-width:1.4rem;border-radius:1px;box-shadow:0 1px 3px rgba(0,0,0,.32);transform:none}
#app.ex li .t>div:first-child{font-style:italic;overflow-wrap:anywhere;line-height:1.35}
#app.ex li .muted{margin:.2rem 0 0;font-size:.9rem;line-height:1.4;color:var(--muted)}
#app.ex li .a{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:.55rem}
#app.ex li .a button{min-height:2.75rem;padding:0 1rem;background:transparent;border:1px solid #bfb08a;border-radius:.4rem;box-shadow:none;color:var(--ink);font:inherit;font-size:.95rem}
#app.ex li:has(.a button:nth-child(2)){border-color:var(--terra)}
#app.ex li:has(.a button:nth-child(2)) .muted{color:var(--terra)}
#app.ex li:has(.a button:nth-child(2)) .a button:first-child{background:var(--terra);border-color:var(--terra);color:#fffaf0;font-weight:700}

/* sent photos: a quiet list, nothing to do with them */
#app.ex details{margin-top:1.3rem;padding-top:.2rem;border-top:1px dashed var(--line)}
#app.ex summary{display:flex;align-items:center;gap:.6rem;min-height:2.9rem;cursor:pointer;font-style:italic;color:var(--muted)}
#app.ex summary::before{content:"\2713";display:grid;place-items:center;width:1.7rem;height:1.7rem;border:2px solid var(--green);border-radius:50%;color:var(--green);font-style:normal;font-weight:700;font-size:.9rem;transform:rotate(-8deg)}
#app.ex details li{display:block;margin:0;padding:.35rem .2rem;background:none;border:0;border-bottom:1px dotted var(--line);box-shadow:none;transform:none!important}
#app.ex details li .t{font-style:italic;font-size:.95rem;color:var(--muted)}

/* the dock: camera in the middle, gallery on the left, send on the right */
#app.ex .row{position:fixed;z-index:5;left:0;right:0;bottom:0;width:min(100%,32rem);margin:0 auto;padding:.8rem 1rem calc(.7rem + env(safe-area-inset-bottom));
  background:var(--dock);border-top:1px solid var(--line);border-radius:1.1rem 1.1rem 0 0;box-shadow:0 -6px 16px rgba(70,50,20,.14);
  display:flex;align-items:flex-end;justify-content:space-between;gap:.5rem}
#app.ex .row>label.btn{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:.35rem;min-height:4.4rem;padding:.2rem;background:none;border:0;border-radius:.6rem;
  box-shadow:none;color:var(--ink);font:inherit;font-size:.88rem;line-height:1.2;text-align:center;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
#app.ex .row>label.btn::before{content:"";width:3rem;height:3rem;border-radius:50%;background:center/50% no-repeat}
#app.ex .row>label.btn:nth-child(2){order:1;width:5.6rem}
#app.ex .row>label.btn:nth-child(2)::before{border:1.5px solid var(--green);
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%233d6b45' stroke-width='1.7' stroke-linecap='round' stroke-linejoin='round'><rect x='3' y='4' width='18' height='16' rx='1.5'/><circle cx='9' cy='10' r='1.6'/><path d='M4 18l5-5 4 4 3-3 4 4'/></svg>")}
#app.ex .row>label.btn:nth-child(1){order:2}
#app.ex .row>label.btn:nth-child(1)::before{width:4.4rem;height:4.4rem;margin-bottom:.1rem;background-color:var(--green);background-size:44%;box-shadow:0 0 0 3px var(--dock),0 0 0 5px var(--green);
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23fbf5e4' stroke-width='1.7' stroke-linecap='round' stroke-linejoin='round'><path d='M4 8h3l1.5-2h7L17 8h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z'/><circle cx='12' cy='13' r='3.5'/></svg>")}
#app.ex .row>button.primary{order:3;align-self:center;display:flex;align-items:center;justify-content:center;gap:.5rem;min-height:3.2rem;padding:0 1.05rem;border:0;border-radius:2rem;
  background:var(--green);color:#fbf5e4;font:inherit;font-size:1rem;font-weight:700;line-height:1.1;box-shadow:0 2px 0 var(--green-d);cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
#app.ex .row>button.primary::before{content:"";flex:none;width:1.25rem;height:1.25rem;background:center/contain no-repeat url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23fbf5e4' stroke-width='1.9' stroke-linecap='round' stroke-linejoin='round'><path d='M4 12l16-8-6 16-3-7-7-1z'/></svg>")}
#app.ex .row>button.primary:disabled{background:transparent;color:var(--muted);border:1.5px dashed #b8aa84;box-shadow:none;opacity:1;cursor:default;font-weight:400}
#app.ex .row>button.primary:disabled::before{opacity:.4;filter:grayscale(1) brightness(.35)}
#app.ex .row>:is(label.btn,button):active{transform:translateY(1px)}
#app.ex .row>:is(label.btn,button):focus-visible,#app.ex .row>label.btn:focus-within{outline:3px solid #1b4fd8;outline-offset:2px}
@media (max-width:350px){#app.ex .row>button.primary{padding:0 .8rem;font-size:.92rem}#app.ex .row>button.primary::before{display:none}#app.ex .row>label.btn:nth-child(2){width:4.8rem}}
@media (prefers-reduced-motion:reduce){#app.ex .row>:is(label.btn,button):active{transform:none}}
</style></head><body>
<noscript><p style="padding:1.2rem;font-family:serif">Explora needs JavaScript on this page to keep your photo queue.</p></noscript>
<main class="page">
  <header class="mast"><p>Explora</p><div class="pm"><img src="/phone/icons/icon-192.png" alt="" width="48" height="48"></div></header>
  <section id="summary" aria-label="Where your photos are"></section>
  <div id="app"></div>
</main>
<script src="/phone/capture-queue.js"></script>
<script>
(function () {
  "use strict";
  var app = document.getElementById("app");
  var summary = document.getElementById("summary");
  var queue = null;
  try { queue = window.ExploraCapture.mount(app); }
  catch (e) { app.textContent = "Explora could not start on this phone. Your gallery still has all your photos."; return; }

  // The two photo pickers are labels around hidden file inputs: make them keyboard and screen-reader friendly.
  function enhance() {
    var labels = app.querySelectorAll("label.btn");
    for (var i = 0; i < labels.length; i++) {
      var l = labels[i];
      if (l.getAttribute("data-kb")) continue;
      l.setAttribute("data-kb", "1");
      l.setAttribute("role", "button");
      l.tabIndex = 0;
      l.addEventListener("keydown", function (e) {
        if (e.key !== "Enter" && e.key !== " ") return;
        e.preventDefault();
        var input = e.currentTarget.querySelector("input");
        if (input) input.click();
      });
    }
  }
  function line(state, label, text) {
    var p = document.createElement("p");
    p.setAttribute("data-state", state);
    var s = document.createElement("strong");
    s.textContent = label + ". ";
    p.appendChild(s);
    p.appendChild(document.createTextNode(text));
    return p;
  }
  // Only says something the page isn't already saying: nothing while the queue shows its own status,
  // nothing for the empty and all-sent cases (the queue's own text covers those).
  function updateSummary() {
    var st = app.querySelector("[role=status]");
    if (st && st.textContent.trim()) { summary.replaceChildren(); return; }
    Promise.resolve(queue.list()).then(function (items) {
      var q = 0, f = 0;
      items.forEach(function (i) { if (i.status === "queued") q++; else if (i.status === "failed") f++; });
      var out = [];
      if (navigator.onLine === false) out.push(line("offline", "Offline", "That's fine. Photos you add will wait on this phone."));
      if (f) out.push(line("failed", "Needs another try", q ? "Tap “Try again” on those photos. The others are still waiting here."
                                                          : "Tap “Try again” on those photos, then send."));
      else if (q) out.push(line("waiting", "Waiting", "These photos are on this phone until you send them."));
      summary.replaceChildren.apply(summary, out);
    }).catch(function () { summary.replaceChildren(); });
  }
  var scheduled = false;
  function refresh() {
    enhance();
    if (scheduled) return;
    scheduled = true;
    setTimeout(function () { scheduled = false; updateSummary(); }, 0);
  }
  new MutationObserver(refresh).observe(app, { childList: true });
  window.addEventListener("online", refresh);
  window.addEventListener("offline", refresh);
  refresh();
})();
</script>
</body></html>
